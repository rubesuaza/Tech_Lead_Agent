[tool.poetry]
name = "tech-lead-agent"
version = "0.1.0"
description = "Tech Lead Agent - Python FastAPI Clean Architecture"
readme = "README.md"
authors = []
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.110.0"
uvicorn = { extras = ["standard"], version = ">=0.27.0" }
pydantic = ">=2.0"
pydantic-settings = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poetry.source]
name = "pypi"
priority = "primary"
