[tool.poetry]
name = "tech_lead_agent"
version = "0.1.0"
description = "Tech Lead Agent - FastAPI Clean Architecture scaffold"
authors = ["Tech Lead Agent <no-reply@example.com>"]
package-mode = false

[tool.poetry.dependencies]
